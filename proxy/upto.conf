# The only thing published to the host. The API and the database are reachable only over
# the compose network.

# Docker's embedded DNS. It is here because nginx resolves an upstream name **once, at
# startup**, and caches the address for the life of the process: recreate the api container
# and nginx keeps posting to an address nothing answers on, returning 502 while the API is
# perfectly healthy. It survives a `docker compose up` on a clean machine and breaks on every
# rebuild after it, which is the quiet-degradation shape H23 describes and H26 now records.
#
# `valid=10s` re-resolves on that interval. The other half of the fix is below: nginx only
# resolves at request time when the upstream is written as a *variable*, so every proxy_pass
# here goes through one, and there is deliberately no `upstream` block to fall back into.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A variable, not a literal — see the resolver note above.
    set $api_backend "api:8000";

    # The front end is a global Vue build loaded directly, with no build step (D3), so
    # these are plain files with no bundler output to fingerprint.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The vendored Vue build never changes without the file changing, so it may be cached
    # hard. It is vendored rather than fetched from a CDN because a dead venue wifi must
    # not kill the demo (§6) — a CDN script tag is exactly that failure.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Server-sent events (D8), and this block comes first because nginx matches the longest
    # prefix. Buffering here is H13: the proxy holds each event until its buffer fills, so
    # the stream arrives in bursts or not at all and the product's live moment silently stops
    # being live. These lines are the mitigation, in place before the first stream exists
    # rather than after it is debugged.
    location ~ ^/api/circles/[0-9]+/stream$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /api/ {
        # With a variable upstream, nginx does not strip the location prefix by itself the
        # way `proxy_pass http://api/;` used to — so the rewrite does it explicitly.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://$api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
