# The only thing published to the host. The API and the database are reachable only over
# the compose network.

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The front end is a global Vue build loaded directly, with no build step (D3), so
    # these are plain files with no bundler output to fingerprint.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The vendored Vue build never changes without the file changing, so it may be cached
    # hard. It is vendored rather than fetched from a CDN because a dead venue wifi must
    # not kill the demo (§6) — a CDN script tag is exactly that failure.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events (D8). Buffering here is H13: the proxy holds each event until its
    # buffer fills, so the stream arrives in bursts or not at all, and the product's live
    # moment silently stops being live. These four lines are the mitigation, and they are
    # in place before the first stream exists rather than after it is debugged.
    location /api/stream/ {
        proxy_pass http://api/stream/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
        proxy_set_header Connection "";
    }

    location = /health {
        proxy_pass http://api/health;
        access_log off;
    }
}
